[pytest]
DJANGO_SETTINGS_MODULE = config.settings
asyncio_mode = auto
# Build test tables from the models: the migration history has a pre-existing conflict (two 0016 leaves)
addopts = --nomigrations -p no:cacheprovider
testpaths = api_agents/agents/tests
# The project's EMAIL_* settings trigger Django deprecation warnings unrelated to these tests
filterwarnings =
    ignore:.*MAILERS.*
