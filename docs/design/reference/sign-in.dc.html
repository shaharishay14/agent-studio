<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Agent Studio</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sky.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&amp;family=Inter:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0;background:#0a0e14}</style>
</helmet>
<div class="s-root">
<div class="si">
<div class="si-art"><a href="SkyLanding.dc.html" class="s-logo" style="font-size: 20px"><span class="s-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5"/><rect x="12" y="12" width="10" height="10" rx="2.6"/><path d="M9 9l5 5" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></span>Agent Studio</a><div class="s-glass" style="border-radius: 26px; padding: 26px; max-width: 460px"><p style="margin: 0; font: 500 30px/36px 'Inter Tight', Inter, sans-serif; letter-spacing: -0.03em">Describe an agent. <em class="s-serif">Watch it work.</em></p><p class="s-muted" style="margin: 12px 0 0">Your agents ask before they send, post or delete anything.</p></div></div>
<div class="si-form">
<div class="s-col" style="gap: 10px"><h1 style="margin: 0; font: 500 40px/44px 'Inter Tight', Inter, sans-serif; letter-spacing: -0.035em">Welcome <em class="s-serif">back</em></h1><p class="s-muted" style="margin: 0">Sign in to your agents.</p></div>
<label class="si-field"><span>Email</span><span class="si-in"><svg class="s-ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><input type="email" placeholder="name@company.com"></span></label>
<label class="si-field"><span class="s-row" style="justify-content: space-between">Password<a class="s-link" href="#forgot" style="font-size: 13px">Forgot password?</a></span><span class="si-in"><svg class="s-ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="{{pwType}}" value="hunter22"><button type="button" class="s-icb" aria-label="{{pwLabel}}" onClick="{{togglePw}}"><svg class="s-ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
<a class="s-btn s-btn--white s-btn--block" href="SkyAgents.dc.html">Sign in</a>
<div class="si-or">Or continue with</div>
<div class="s-row" style="gap: 10px; flex-wrap: nowrap"><button class="s-btn s-btn--glass" style="flex: 1"><svg class="s-ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>Google</button><button class="s-btn s-btn--glass" style="flex: 1"><svg class="s-ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.3 6.4-1.5 6.4-7A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.9 1S18.7.7 16 2.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1 5.1 1A5 5 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.3 6.6 6.4 7a3.4 3.4 0 0 0-.9 2.6V22"/></svg>GitHub</button></div>
<p class="s-muted" style="margin: 0; text-align: center; font-size: 14px">New here? <a class="s-link" href="#signup">Create an account</a></p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { show: false }; }
  renderVals() { var s = this.state, self = this; return { pwType: s.show ? "text" : "password", pwLabel: s.show ? "Hide password" : "Show password", togglePw: function () { self.setState({ show: !self.state.show }); } }; }
}
</script>
</body>
</html>
